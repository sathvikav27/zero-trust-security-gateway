
services:
  postgres:
    image: postgres:17
    container_name: zero-trust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: zerotrust
      POSTGRES_USER: zerotrust_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zerotrust_app -d zerotrust"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: